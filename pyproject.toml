[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "litearm-vla"
version = "0.0.0+semantic-release"
description = "LiteArm VLA data collection and embodiment adapters"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "lerobot==0.4.4",
    "litearm-python>=2.1.0,<3",
    "litearm-lerobot",
    # The gripper SDK is not on PyPI; pin the upstream commit so an install
    # reproduces the API this adapter uses (fresh/data_age_s status fields).
    "litegrip @ git+https://github.com/nexform-tech/litegrip-python.git@0d46d6d8c598c0caa1ca863748dffb0328d5b80e",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
litearm-vla-record = "litearm_vla.record:main"
litearm-vla-run-policy = "litearm_vla.deployment:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
